<footer class="bg-white border-t border-blue-600/10 py-12">
	<div class="max-w-5xl mx-auto px-6">
		<div class="flex justify-between">
			<div class="">
				<div class="flex items-center gap-2.5 mb-4">
					<div class="w-8 h-8 bg-blue-800 rounded-lg flex items-center justify-center shadow">
						<svg class="w-4 h-4 text-white" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
							<path stroke-linecap="round" stroke-linejoin="round" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z" />
						</svg>
					</div>
					<span class="brand text-xl text-blue-800">{{ g.settings['site_title'] }}</span>
				</div>
				<p class="text-sm text-blue-800/50 leading-relaxed max-w-xs">{{ g.settings['site_description'] }}</p>
				<div class="flex items-center gap-3 mt-5">
					{% if g.settings['csr_telegram_username'] %}
					<a href="https://t.me/{{ g.settings['csr_telegram_username'] }}" class="w-8 h-8 rounded-lg border border-blue-600/20 flex items-center justify-center text-blue-800/40 hover:text-blue-800 hover:border-blue-600/50 transition">
						<svg class="w-4 h-4" viewBox="0 0 24 24" fill="currentColor">
							<path d="M12 0C5.373 0 0 5.373 0 12s5.373 12 12 12 12-5.373 12-12S18.627 0 12 0zm5.562 8.248l-1.97 9.289c-.145.658-.537.818-1.084.508l-3-2.21-1.447 1.394c-.16.16-.295.295-.605.295l.213-3.053 5.56-5.023c.242-.213-.054-.333-.373-.12l-6.871 4.326-2.962-.924c-.643-.204-.657-.643.136-.953l11.57-4.461c.537-.194 1.006.131.833.932z" />
						</svg>
					</a>
					{% endif %}
					{% if g.settings['csr_email'] %}
					<a href="mailto:{{ g.settings['csr_email'] }}" class="w-8 h-8 rounded-lg border border-blue-600/20 flex items-center justify-center text-blue-800/40 hover:text-blue-800 hover:border-blue-600/50 transition">
						<svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
							<path stroke-linecap="round" d="M3 8l9 6 9-6M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z" />
						</svg>
					</a>
					{% endif %}
				</div>
			</div>
			<div>
				<p class="text-right text-xs font-bold text-blue-800/30 uppercase tracking-widest mb-4">Product</p>
				<ul class="text-right space-y-2.5 text-sm text-blue-800/55">
					<li>
						<a href="#features" class="hover:text-blue-800 transition">Features</a>
					</li>
					<li>
						<a href="#how" class="hover:text-blue-800 transition">How It Works</a>
					</li>
					<li>
						<a href="#faq" class="hover:text-blue-800 transition">FAQ</a>
					</li>
					<li>
						<a href="#waitlist" class="hover:text-blue-800 transition">Early Access</a>
					</li>
				</ul>
			</div>
		</div>
		<div class="border-t border-blue-600/8 pt-6 mt-6 flex flex-col md:flex-row items-center justify-between gap-3">
			<p class="text-xs text-blue-800/35">© 2026 {{ g.settings['site_title'] }}. All rights reserved.</p>
		</div>
	</div>
</footer>
